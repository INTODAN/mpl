# Centrifugo 6.9.6 configuration. Secrets are supplied by Docker Compose as
# Centrifugo environment variables; do not put production values in this file.

[client]
# Local browser origins. Deployments override this with
# CENTRIFUGO_CLIENT_ALLOWED_ORIGINS.
allowed_origins = ["http://localhost:3000", "http://127.0.0.1:3000"]

[client.subscribe_to_user_personal_channel]
enabled = false
single_connection = false

# A proxy call applies due expiry and pushes the result before it answers. A
# push that retries can take about 1.2 s, past Centrifugo's 1 s default.
[channel.proxy.subscribe]
endpoint = "http://host.docker.internal:8888/internal/lobby/centrifugo/subscribe"
timeout = "5s"

[channel.proxy.subscribe.http]
static_headers = { "X-Lobby-Proxy-Secret" = "${CENTRIFUGO_VAR_LOBBY_PROXY_SECRET}" }

[channel.proxy.sub_refresh]
endpoint = "http://host.docker.internal:8888/internal/lobby/centrifugo/sub-refresh"
timeout = "5s"

[channel.proxy.sub_refresh.http]
static_headers = { "X-Lobby-Proxy-Secret" = "${CENTRIFUGO_VAR_LOBBY_PROXY_SECRET}" }

[channel.without_namespace]
allow_subscribe_for_client = false
allow_subscribe_for_anonymous = false
allow_publish_for_client = false
allow_publish_for_subscriber = false
allow_publish_for_anonymous = false
allow_history_for_client = false
allow_history_for_subscriber = false
allow_history_for_anonymous = false
allow_presence_for_client = false
allow_presence_for_subscriber = false
allow_presence_for_anonymous = false
allow_user_limited_channels = false
join_leave = false
force_push_join_leave = false

[[channel.namespaces]]
name = "lobby"
subscribe_proxy_enabled = true
sub_refresh_proxy_enabled = true
history_size = 128
history_ttl = "300s"
force_recovery = true
force_positioning = true
allow_publish_for_client = false
allow_publish_for_subscriber = false
allow_publish_for_anonymous = false
allow_history_for_client = false
allow_history_for_subscriber = false
allow_history_for_anonymous = false
allow_presence_for_client = false
allow_presence_for_subscriber = false
allow_presence_for_anonymous = false
allow_user_limited_channels = false
join_leave = false
force_push_join_leave = false

# The backend pushes each game event once, right after its commit. History lets
# a reconnecting player recover events it missed, as on the lobby channel.
[[channel.namespaces]]
name = "player"
subscribe_proxy_enabled = true
sub_refresh_proxy_enabled = true
history_size = 128
history_ttl = "300s"
force_recovery = true
force_positioning = true
allow_publish_for_client = false
allow_publish_for_subscriber = false
allow_publish_for_anonymous = false
allow_history_for_client = false
allow_history_for_subscriber = false
allow_history_for_anonymous = false
allow_presence_for_client = false
allow_presence_for_subscriber = false
allow_presence_for_anonymous = false
allow_user_limited_channels = false
join_leave = false
force_push_join_leave = false

# A lobby's game for people who watch it with the join code. The subscribe
# proxy allows active members and watchers the host hasn't kicked; the host's
# kick unsubscribes a watcher at once. History lets a reconnecting watcher
# recover what it missed, as on the player channel.
[[channel.namespaces]]
name = "watch"
subscribe_proxy_enabled = true
sub_refresh_proxy_enabled = true
history_size = 128
history_ttl = "300s"
force_recovery = true
force_positioning = true
allow_publish_for_client = false
allow_publish_for_subscriber = false
allow_publish_for_anonymous = false
allow_history_for_client = false
allow_history_for_subscriber = false
allow_history_for_anonymous = false
allow_presence_for_client = false
allow_presence_for_subscriber = false
allow_presence_for_anonymous = false
allow_user_limited_channels = false
join_leave = false
force_push_join_leave = false

[admin]
enabled = true

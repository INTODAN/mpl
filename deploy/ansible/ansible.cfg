[defaults]
# scripts/vm.sh installs requirements.yml here.
collections_path = ./.collections
roles_path = ./roles
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# Trust a new VM's host key on first contact, but refuse a changed key. After
# moving the static IP to a replacement VM, remove the old key with
# `ssh-keygen -R <static IP>`.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new

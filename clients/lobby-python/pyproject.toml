[project]
name = "mpl-lobby-client"
version = "0.0.0.dev0"
description = "Generic lobby Python client"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "centrifuge-python==0.6.0",
    # lobby_api_client (generated, shipped in this distribution) needs httpx and attrs.
    "httpx>=0.27,<1",
    "attrs>=22.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.build-backend]
module-name = ["lobby_client", "lobby_api_client"]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "mpl-lobby-client"
version = "0.0.0.dev0"
description = "Generic lobby Python client"
requires-python = ">=3.14"
dependencies = [
    "centrifuge-python==0.6.0",
    "httpx>=0.27,<1",
    "mpl-lobby-api-client",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.uv.sources]
mpl-lobby-api-client = { path = "./generated", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.build-backend]
module-name = "lobby_client"
module-root = ""

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
